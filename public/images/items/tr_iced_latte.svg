<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLatte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211710"/>
      <stop offset="100%" stop-color="#120d09"/>
    </linearGradient>
    <linearGradient id="latteLayer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a2c1d"/>
      <stop offset="35%" stop-color="#8c5835"/>
      <stop offset="60%" stop-color="#d9b48f"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgLatte)"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#d97706" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="350" rx="65" ry="15" fill="#000000" opacity="0.65"/>

  <!-- Glass Body with milk and espresso layering -->
  <path d="M140 100 L152 330 Q154 342 166 342 L234 342 Q246 342 248 330 L260 100 Z" fill="url(#latteLayer)"/>

  <!-- Ice cubes -->
  <rect x="165" y="130" width="35" height="35" rx="7" fill="#ffffff" opacity="0.5" transform="rotate(18 182 147)"/>
  <rect x="200" y="150" width="38" height="38" rx="7" fill="#ffffff" opacity="0.55" transform="rotate(-12 219 169)"/>
  <rect x="175" y="195" width="32" height="32" rx="6" fill="#ffffff" opacity="0.4" transform="rotate(20 191 211)"/>

  <!-- Coffee top crema -->
  <ellipse cx="200" cy="100" rx="60" ry="12" fill="#5c3826"/>
  <ellipse cx="200" cy="100" rx="50" ry="8" fill="#a86e49" opacity="0.75"/>

  <!-- Glass Shine -->
  <path d="M145 110 L155 325" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>
  <path d="M255 110 L245 325" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <ellipse cx="200" cy="98" rx="61" ry="11" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

  <!-- Eco Paper Straw -->
  <line x1="225" y1="50" x2="195" y2="280" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <line x1="223" y1="55" x2="225" y2="52" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Label Badge -->
  <g transform="translate(200, 368)">
    <rect x="-80" y="-14" width="160" height="26" rx="13" fill="#d97706" stroke="#fbbf24" stroke-width="1"/>
    <text x="0" y="3" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">ARTISAN ICED LATTE</text>
  </g>
</svg>
