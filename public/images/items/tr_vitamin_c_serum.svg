<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSerum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1608"/>
      <stop offset="60%" stop-color="#1f0f04"/>
      <stop offset="100%" stop-color="#0a0502"/>
    </linearGradient>
    <linearGradient id="amberGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="dropperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="serumGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgSerum)"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#f59e0b" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="345" rx="65" ry="16" fill="#000000" opacity="0.7"/>

  <!-- Bottle Body -->
  <rect x="145" y="160" width="110" height="175" rx="20" fill="url(#amberGlass)"/>
  
  <!-- Bottle Neck & Rim -->
  <rect x="175" y="130" width="50" height="30" rx="4" fill="#92400e"/>
  <rect x="170" y="125" width="60" height="8" rx="3" fill="#b45309"/>

  <!-- Dropper Cap Base -->
  <rect x="168" y="95" width="64" height="30" rx="4" fill="url(#dropperGrad)" stroke="#334155" stroke-width="1"/>
  
  <!-- Dropper Rubber Bulb -->
  <path d="M180 95 C180 60, 220 60, 220 95 Z" fill="#0f172a" stroke="#334155" stroke-width="1"/>

  <!-- Serum Level & Inner Liquid Glow -->
  <rect x="153" y="190" width="94" height="135" rx="12" fill="#fbbf24" opacity="0.3" filter="url(#serumGlow)"/>

  <!-- Skincare Bottle Luxury Label -->
  <rect x="156" y="195" width="88" height="95" rx="8" fill="#ffffff" stroke="#fef3c7" stroke-width="1.5"/>
  <text x="200" y="215" fill="#78350f" font-family="system-ui, sans-serif" font-size="8.5" font-weight="900" text-anchor="middle" letter-spacing="1.5">TR BOTANICALS</text>
  <line x1="175" y1="222" x2="225" y2="222" stroke="#d97706" stroke-width="1"/>
  <text x="200" y="238" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle">VITAMIN C</text>
  <text x="200" y="250" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">15% GLOW SERUM</text>
  <text x="200" y="272" fill="#64748b" font-family="system-ui, sans-serif" font-size="6.5" font-weight="600" text-anchor="middle">30ml • 1.0 fl oz</text>

  <!-- Glass Highlights -->
  <path d="M152 170 L152 325" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M246 170 L246 325" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>

  <!-- Pipette Golden Serum Droplet -->
  <g transform="translate(270, 160)">
    <circle cx="0" cy="0" r="16" fill="#f59e0b" opacity="0.2"/>
    <path d="M0 -15 C8 -4, 12 4, 0 16 C-12 4, -8 -4, 0 -15 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1" filter="url(#serumGlow)"/>
    <circle cx="-2" cy="4" r="3" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Sparkles -->
  <polygon points="120,110 123,116 129,118 123,120 120,126 117,120 111,118 117,116" fill="#f59e0b"/>
  <polygon points="280,240 282,244 287,245 282,247 280,251 278,247 273,245 278,244" fill="#fbbf24"/>

  <!-- Label Badge -->
  <g transform="translate(200, 368)">
    <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#ea580c" stroke="#fbbf24" stroke-width="1"/>
    <text x="0" y="3" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">VITAMIN C GLOW SERUM</text>
  </g>
</svg>
