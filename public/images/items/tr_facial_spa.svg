<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSpa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1026"/>
      <stop offset="50%" stop-color="#2d133b"/>
      <stop offset="100%" stop-color="#0e0614"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgSpa)"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#d8b4fe" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Relaxing Warm Towel Roll -->
  <g transform="translate(130, 240)">
    <ellipse cx="0" cy="0" rx="45" ry="30" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="-5" cy="0" rx="35" ry="22" fill="#f1f5f9"/>
    <ellipse cx="-10" cy="0" rx="20" ry="12" fill="#e2e8f0"/>
    <path d="M0 -30 L110 -15 C130 -10, 130 30, 110 35 L0 30 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M20 -28 L110 -15" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <!-- Jade Roller Tool -->
  <g transform="translate(230, 150) rotate(-35)">
    <!-- Gold handle frame -->
    <rect x="-6" y="-30" width="12" height="120" rx="6" fill="#d97706" stroke="#fbbf24" stroke-width="1"/>
    <!-- Top arm forks -->
    <path d="M-25 -30 C-25 -50, 25 -50, 25 -30" stroke="#d97706" stroke-width="5" fill="none"/>
    <!-- Jade large roller stone -->
    <rect x="-24" y="-60" width="48" height="24" rx="10" fill="url(#jadeGrad)"/>
    <ellipse cx="0" cy="-48" rx="20" ry="6" fill="#ecfdf5" opacity="0.6"/>
  </g>

  <!-- Lotus Flower Illustration -->
  <g transform="translate(130, 130)">
    <path d="M0 20 C-30 0, -35 -30, 0 -45 C35 -30, 30 0, 0 20 Z" fill="#f472b6" opacity="0.9"/>
    <path d="M0 20 C-50 10, -50 -15, -15 -35 C-5 0, 0 10, 0 20 Z" fill="#ec4899" opacity="0.75"/>
    <path d="M0 20 C50 10, 50 -15, 15 -35 C5 0, 0 10, 0 20 Z" fill="#ec4899" opacity="0.75"/>
    <circle cx="0" cy="-5" r="6" fill="#fde047"/>
  </g>

  <!-- Calming essential oil droplets -->
  <circle cx="280" cy="180" r="4" fill="#a7f3d0" opacity="0.7"/>
  <circle cx="295" cy="205" r="3" fill="#a7f3d0" opacity="0.5"/>

  <!-- Label Badge -->
  <g transform="translate(200, 368)">
    <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#7e22ce" stroke="#d8b4fe" stroke-width="1"/>
    <text x="0" y="3" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">FACIAL SPA &amp; MASSAGE</text>
  </g>
</svg>
