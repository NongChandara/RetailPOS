<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTumbler" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06241a"/>
      <stop offset="50%" stop-color="#02140e"/>
      <stop offset="100%" stop-color="#010a07"/>
    </linearGradient>
    <linearGradient id="tumblerBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="35%" stop-color="#059669"/>
      <stop offset="65%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="steelLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgTumbler)"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#10b981" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="350" rx="60" ry="15" fill="#000000" opacity="0.7"/>

  <!-- Stainless Steel Lid & Rim -->
  <rect x="145" y="90" width="110" height="24" rx="6" fill="url(#steelLid)"/>
  <rect x="140" y="110" width="120" height="12" rx="4" fill="#1e293b"/>

  <!-- Reusable Straw -->
  <rect x="195" y="45" width="10" height="60" rx="3" fill="#cbd5e1"/>
  <line x1="197" y1="45" x2="197" y2="105" stroke="#ffffff" stroke-width="2"/>

  <!-- Tumbler Body -->
  <path d="M145 120 L156 325 Q158 340 172 340 L228 340 Q242 340 244 325 L255 120 Z" fill="url(#tumblerBody)"/>

  <!-- Matte Emerald Vertical Highlight -->
  <path d="M152 130 L162 325" stroke="#34d399" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- TR Laser Engraved Logo on Tumbler -->
  <g transform="translate(200, 220)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="0" y="-8" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="2">TR</text>
    <text x="0" y="8" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="7" font-weight="700" text-anchor="middle" letter-spacing="1">THERMAL</text>
    <text x="0" y="20" fill="#facc15" font-family="system-ui, sans-serif" font-size="6" font-weight="800" text-anchor="middle">HOT • COLD 12H</text>
  </g>

  <!-- Ice / Hot Steam Badges -->
  <text x="120" y="160" fill="#38bdf8" font-size="18">❄️</text>
  <text x="270" y="150" fill="#f59e0b" font-size="18">🔥</text>

  <!-- Label Badge -->
  <g transform="translate(200, 368)">
    <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#047857" stroke="#34d399" stroke-width="1"/>
    <text x="0" y="3" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">TR THERMAL TUMBLER</text>
  </g>
</svg>
