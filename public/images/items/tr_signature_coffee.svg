<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1814"/>
      <stop offset="50%" stop-color="#2c1f18"/>
      <stop offset="100%" stop-color="#0f0c0a"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d2314"/>
      <stop offset="35%" stop-color="#5a3821"/>
      <stop offset="70%" stop-color="#945f34"/>
      <stop offset="100%" stop-color="#f5d6a4"/>
    </linearGradient>
    <linearGradient id="creamerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f5e6d3" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative circles -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#f59e0b" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="200" cy="200" r="175" fill="none" stroke="#047857" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Glass Shadow -->
  <ellipse cx="200" cy="350" rx="70" ry="16" fill="#000000" opacity="0.6"/>

  <!-- Glass Cup Silhouette -->
  <path d="M135 110 L150 330 Q152 342 165 342 L235 342 Q248 342 250 330 L265 110 Z" fill="url(#coffeeGrad)"/>

  <!-- Cream Swirls at bottom (Condensed milk) -->
  <path d="M150 310 Q170 300 200 315 Q230 305 250 320 L250 330 Q248 342 235 342 L165 342 Q152 342 150 330 Z" fill="#fff7ed" opacity="0.92"/>
  <path d="M155 285 Q175 270 200 290 Q225 280 245 295 L248 310 Q230 295 200 305 Q170 290 152 300 Z" fill="#fed7aa" opacity="0.8"/>

  <!-- Floating Ice Cubes -->
  <rect x="160" y="140" width="34" height="34" rx="6" fill="#ffffff" opacity="0.45" transform="rotate(12 177 157)"/>
  <rect x="205" y="155" width="36" height="36" rx="6" fill="#ffffff" opacity="0.5" transform="rotate(-15 223 173)"/>
  <rect x="175" y="195" width="32" height="32" rx="6" fill="#ffffff" opacity="0.38" transform="rotate(25 191 211)"/>

  <!-- Coffee surface and crema -->
  <ellipse cx="200" cy="110" rx="65" ry="14" fill="#6d3d1f"/>
  <ellipse cx="200" cy="110" rx="55" ry="10" fill="#a4683c" opacity="0.7"/>

  <!-- Glass Highlights -->
  <path d="M140 120 L153 325" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M146 125 L157 280" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M260 120 L248 325" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.25"/>

  <!-- Glass Lip -->
  <ellipse cx="200" cy="108" rx="66" ry="13" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>

  <!-- Straw -->
  <path d="M225 60 L205 130 L195 270" stroke="#047857" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M225 60 L205 130 L195 270" stroke="#34d399" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Badge / Branding Banner -->
  <g transform="translate(200, 368)">
    <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#047857" stroke="#10b981" stroke-width="1"/>
    <text x="0" y="3" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">TR SIGNATURE ICED</text>
  </g>

  <!-- Sparkles -->
  <polygon points="120,90 123,96 130,98 123,101 120,107 117,101 110,98 117,96" fill="#f59e0b" filter="url(#glow)"/>
  <polygon points="280,140 282,145 288,146 282,148 280,154 278,148 272,146 278,145" fill="#f59e0b" opacity="0.9"/>
</svg>
